<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구매·수출·재고 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg:#faf7f2; --card:#fffdf9; --ink:#2b2622; --mut:#8a7f72; --line:#ebe4d8; --soft:#f3ede3;
    --acc:#c2410c; --acc-soft:#fbeee6; --ok:#3f6212; --ok-soft:#ecf3df;
    --red:#b42318; --red-soft:#fdecea; --red-line:#f1c9c4; --warn:#9a3412; --warn-soft:#fdf1e7; --warn-line:#f2d3bd;
    --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Malgun Gothic", sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--font); letter-spacing:-0.01em; overflow-wrap:break-word; }
  :lang(ko) { word-break:keep-all; }
  :lang(zh) { word-break:normal; line-break:strict; }
  button, input, select { font:inherit; color:inherit; letter-spacing:inherit; }

  header { position:sticky; top:0; z-index:5; background:rgba(250,247,242,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .head { max-width:1360px; margin:0 auto; padding:12px 24px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
  .brand { font-size:19px; font-weight:700; margin:0; white-space:nowrap; }
  .meta { color:var(--mut); font-size:13px; flex:1 1 200px; min-width:0; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .lang { margin-left:auto; display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--card); }
  .lang button { border:0; background:none; padding:4px 12px; border-radius:999px; cursor:pointer; font-size:13px; color:var(--mut); white-space:nowrap; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:6px 16px; border-radius:999px; border:1px solid var(--acc); background:var(--acc); color:#fff; cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; }
  .btn:hover { filter:brightness(1.07); }
  .btn.ghost { background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--mut); filter:none; }
  .btn.danger { background:var(--card); color:var(--red); border-color:var(--red-line); }
  .btn.sm { min-height:30px; padding:3px 12px; font-size:13px; }
  .btn:disabled { opacity:.4; cursor:default; filter:none; }
  .btn:focus-visible, .lang button:focus-visible, nav button:focus-visible, .linkbtn:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  main { max-width:1360px; margin:0 auto; padding:18px 24px 64px; }
  nav { display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; }
  nav button { border:0; background:none; padding:10px 16px; cursor:pointer; color:var(--mut); font-size:15px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  nav button.on { color:var(--ink); border-bottom-color:var(--acc); }
  nav .cnt { display:inline-block; margin-left:6px; font-size:12px; padding:0 7px; border-radius:999px; background:var(--soft); color:var(--mut); }
  nav .cnt.alert { background:var(--red); color:#fff; }

  .banner { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; background:var(--red-soft); border:1px solid var(--red-line); color:var(--red); border-radius:14px; padding:12px 18px; margin-bottom:16px; }
  .banner b { font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; min-width:0; }
  .card h2 { font-size:16px; font-weight:600; margin:0 0 12px; }
  .card h3 { font-size:15px; font-weight:600; margin:0 0 10px; }
  .muted { color:var(--mut); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; min-width:0; }
  .stat span { display:block; color:var(--mut); font-size:13px; }
  .stat b { display:block; margin-top:2px; font-size:clamp(19px, 2.1vw, 25px); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.25; }
  .stat.hl { background:var(--acc-soft); border-color:var(--warn-line); }
  .stat.hl b { color:var(--acc); }

  .filters { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin-bottom:14px; }
  .f { display:grid; gap:3px; font-size:12px; color:var(--mut); min-width:0; }
  .f > span { white-space:nowrap; }
  .f .row { display:flex; align-items:center; gap:6px; color:var(--ink); }
  input[type=date], input[type=search], input[type=text], input[type=number], input[type=email], input[type=password], select {
    min-height:36px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; min-width:0; }
  input[type=search], input[type=text] { width:12em; max-width:100%; }
  input:focus, select:focus { outline:2px solid var(--acc-soft); border-color:var(--acc); }
  .multi { position:relative; }
  .multi summary { list-style:none; cursor:pointer; min-height:36px; padding:6px 30px 6px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); white-space:nowrap; max-width:16em; overflow:hidden; text-overflow:ellipsis; position:relative; }
  .multi summary::after { content:"▾"; position:absolute; right:10px; color:var(--mut); }
  .multi summary::-webkit-details-marker { display:none; }
  .multi .opts { position:absolute; z-index:6; top:calc(100% + 4px); left:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; min-width:15em; max-height:320px; overflow:auto; box-shadow:0 8px 24px rgba(43,38,34,.12); }
  .multi label { display:flex; gap:8px; align-items:center; padding:4px 6px; border-radius:6px; color:var(--ink); font-size:14px; cursor:pointer; white-space:nowrap; }
  .multi label:hover { background:var(--soft); }
  .multi .tools { display:flex; gap:6px; padding:2px 2px 6px; border-bottom:1px solid var(--line); margin-bottom:4px; }

  .selbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 14px; margin-bottom:12px; border-radius:12px; background:var(--soft); }
  .selbar .sum { font-size:14px; }
  .selbar .sum b { font-variant-numeric:tabular-nums; }
  .selbar .grow { flex:1 1 0; }
  .panel { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:12px 14px; margin-bottom:12px; border:1px solid var(--warn-line); background:var(--warn-soft); border-radius:12px; }

  .scroll { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:12px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  th { background:var(--soft); color:var(--mut); font-size:13px; font-weight:600; position:sticky; top:0; z-index:1; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.wrap { white-space:normal; min-width:10em; max-width:26em; }
  tbody tr:hover td { background:#fbf8f3; }
  .seltable tbody { user-select:none; cursor:pointer; }
  .seltable tbody tr.sel td { background:var(--acc-soft); }
  tr.ret td { background:var(--red-soft) !important; }
  tr.ret td:first-child { box-shadow:inset 3px 0 0 var(--red); }
  tr.sub > td { background:#fcfaf6; padding:0 12px 12px 44px; }
  tr.sub table { font-size:13px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .linkbtn { border:0; background:none; padding:0; cursor:pointer; color:var(--acc); font-weight:600; text-decoration:underline; text-underline-offset:3px; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; white-space:nowrap; background:var(--soft); color:var(--mut); }
  .tag.stock { background:var(--acc-soft); color:var(--acc); }
  .tag.exp { background:var(--ok-soft); color:var(--ok); }
  .tag.ret { background:var(--red); color:#fff; }
  .tag.pend { background:var(--red-soft); color:var(--red); }
  .empty { text-align:center; padding:40px 16px; color:var(--mut); white-space:normal; }
  .warnlist { background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--warn); border-radius:12px; padding:10px 14px 10px 30px; margin:10px 0; font-size:14px; }
  .itemsform { width:100%; }
  .itemsform td { padding:6px; border:0; }
  .itemsform input { width:100%; }
  .err { color:var(--red); font-size:13px; min-height:1.2em; margin:6px 0 0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
  [hidden] { display:none !important; }

  body.out main > :not(#login), body.out .actions, body.out .meta, body:not(.out) #login { display:none !important; }
  body.busy, body.busy * { cursor:progress !important; }
  #login { max-width:380px; margin:8vh auto 0; }
  #login form { display:grid; gap:12px; }
  #login label { display:grid; gap:4px; font-size:13px; color:var(--mut); }
  #login input { width:100%; }

  @media (max-width:640px) {
    .head, main { padding-left:16px; padding-right:16px; }
    .lang { order:1; } .brand { order:0; }
    .meta { order:2; flex-basis:100%; } .actions { order:3; width:100%; }
  }
</style>
</head>
<body class="out">
<header>
  <div class="head">
    <h1 class="brand" data-i18n="title"></h1>
    <span class="meta" id="meta"></span>
    <div class="actions">
      <button class="btn ghost" id="backup" data-i18n="backup"></button>
      <label class="btn ghost"><span data-i18n="restore"></span><input type="file" id="restoreFile" accept=".xlsx" hidden></label>
      <button class="btn ghost" id="logout" data-i18n="logout"></button>
    </div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="zh">中文</button></div>
  </div>
</header>

<main>
  <section id="login" class="card">
    <h2 data-i18n="loginTitle"></h2>
    <form id="loginForm">
      <label><span data-i18n="email"></span><input type="email" id="email" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input type="password" id="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit" data-i18n="loginBtn"></button>
    </form>
  </section>

  <div class="banner" id="refundBanner" hidden></div>

  <nav>
    <button data-tab="pay" class="on"><span data-i18n="tabPay"></span></button>
    <button data-tab="stock"><span data-i18n="tabStock"></span><span class="cnt" id="cntStock"></span></button>
    <button data-tab="done"><span data-i18n="tabDone"></span><span class="cnt" id="cntDone"></span></button>
    <button data-tab="ref"><span data-i18n="tabRef"></span><span class="cnt" id="cntRef"></span></button>
    <button data-tab="input"><span data-i18n="tabInput"></span></button>
  </nav>

  <!-- 결제건 -->
  <section id="tab-pay">
    <div class="card">
      <div class="filters" id="fPay"></div>
      <div class="selbar"><span class="sum" id="paySum"></span><span class="grow"></span><button class="btn ghost sm" id="payXlsx" data-i18n="xlsx"></button></div>
      <div class="scroll"><table id="payTable"></table></div>
    </div>
  </section>

  <!-- 재고 -->
  <section id="tab-stock" hidden>
    <div class="stats" id="stockStats"></div>
    <div class="card">
      <div class="filters" id="fStock"></div>
      <div class="selbar">
        <span class="sum" id="stockSel"></span><span class="grow"></span>
        <button class="btn ghost sm" id="stockXlsx" data-i18n="xlsx"></button>
        <button class="btn" id="stockExport" data-i18n="bulkExport"></button>
      </div>
      <div class="panel" id="exportPanel" hidden>
        <span data-i18n="expDate"></span> <input type="date" id="expDate">
        <span id="exportPanelSum"></span>
        <button class="btn" id="exportGo" data-i18n="confirmExport"></button>
        <button class="btn ghost" id="exportCancel" data-i18n="cancel"></button>
      </div>
      <div class="scroll"><table id="stockTable" class="seltable"></table></div>
    </div>
  </section>

  <!-- 수출 완료 -->
  <section id="tab-done" hidden>
    <div class="card">
      <div class="filters" id="fDone"></div>
      <div class="selbar">
        <span class="sum" id="doneSel"></span><span class="grow"></span>
        <button class="btn ghost sm" id="doneXlsx" data-i18n="xlsx"></button>
        <button class="btn danger sm" id="doneUndo" data-i18n="undoExport"></button>
      </div>
      <div class="scroll"><table id="doneTable" class="seltable"></table></div>
    </div>
  </section>

  <!-- 반품·환불 -->
  <section id="tab-ref" hidden>
    <div class="card" id="linkCard" hidden></div>
    <div class="card">
      <div class="filters" id="fRef"></div>
      <div class="selbar"><span class="sum" id="refSum"></span><span class="grow"></span><button class="btn ghost sm" id="refXlsx" data-i18n="xlsx"></button></div>
      <div class="scroll"><table id="refTable"></table></div>
    </div>
  </section>

  <!-- 입력 -->
  <section id="tab-input" hidden>
    <div class="grid2">
      <div class="card">
        <h2 data-i18n="xlUpload"></h2>
        <p class="muted" data-i18n="xlUploadHelp"></p>
        <label class="btn"><span data-i18n="chooseFile"></span><input type="file" id="xlFile" accept=".xlsx,.xls" hidden></label>
        <div id="xlPreview"></div>
      </div>
      <div class="card">
        <h2 data-i18n="manual"></h2>
        <form id="manForm">
          <div class="filters">
            <label class="f"><span data-i18n="payDate"></span><input type="date" id="mDate" required></label>
            <label class="f"><span data-i18n="cardAmt"></span><input type="number" id="mAmt" step="any" required></label>
            <label class="f"><span data-i18n="note"></span><input type="text" id="mNote"></label>
          </div>
          <p class="muted" data-i18n="manualHelp"></p>
          <table class="itemsform"><thead><tr><th data-i18n="name"></th><th data-i18n="qty"></th><th data-i18n="price"></th><th data-i18n="weightCol"></th><th></th></tr></thead><tbody id="mItems"></tbody></table>
          <datalist id="nameList"></datalist>
          <p><button type="button" class="btn ghost sm" id="mAdd" data-i18n="addItem"></button></p>
          <p class="err" id="mErr" role="alert"></p>
          <button class="btn" type="submit" data-i18n="save"></button>
        </form>
      </div>
    </div>
  </section>
</main>

<!-- core: Excel parsing, no DOM; also run by the test script -->
<script id="core">
const SLOTS = [['E','F','G','H'], ['I','J','K','L'], ['M','N','O','P'], ['Q','R','S','T']];
const num = v => typeof v === 'number' && isFinite(v) ? v : null;
const won = n => Math.round(n).toLocaleString('ko-KR');
const kg = n => (Math.round(n * 100) / 100).toLocaleString('ko-KR');
const serialToISO = s => new Date(Math.round((s - 25569) * 864e5)).toISOString().slice(0, 10);

// Reads columns A–T only (hidden B,C ignored). Row with a date in A = one card payment; negative D = refund.
// src_key identifies a row across re-uploads: same date+amount+items (+ordinal for exact duplicates).
// shortcut: editing an already-imported row in Excel changes its key, so it would import again as new → shown in the preview first.
function parseSheet(ws) {
  const payments = [], refunds = [], warn = [], seen = {};
  const last = XLSX.utils.decode_range(ws['!ref']).e.r + 1;
  const val = (c, r) => { const x = ws[c + r]; return x ? x.v : undefined; };
  const keyOf = base => { seen[base] = (seen[base] || 0) + 1; return base + '#' + seen[base]; };
  for (let r = 2; r <= last; r++) {
    const a = ws['A' + r];
    if (!a || a.t !== 'n') {
      if (a && a.t === 's' && a.v.trim() && a.v.trim() !== '合计') warn.push({ k: 'notDate', r, v: a.v });
      continue;
    }
    const date = serialToISO(a.v), amount = num(val('D', r)) ?? 0;
    const items = [], notes = [];
    SLOTS.forEach(([cn, cq, cp, cw]) => {
      const name = String(val(cn, r) ?? '').trim(), qty = num(val(cq, r));
      if (qty === null || qty <= 0) { if (name) notes.push(name); return; }
      const price = num(val(cp, r)), rawW = val(cw, r), weight = num(rawW);
      if (price === null) warn.push({ k: 'badPrice', r, c: cp });
      if (weight === null && rawW != null && String(rawW).trim()) warn.push({ k: 'badWeight', r, c: cw, v: rawW });
      items.push({ name, qty, price: price || 0, weight: weight || 0 });
    });
    const note = notes.join(', ');
    if (amount < 0) {
      refunds.push({ tx_date: date, amount, note, src_row: r, src_key: keyOf(['R', date, amount].join('|')) });
      continue;
    }
    const sum = items.reduce((s, x) => s + x.qty * x.price, 0);
    if (items.length && Math.abs(sum - amount) > 1) warn.push({ k: 'mismatch', r, a: amount, b: sum });
    const sig = items.map(i => [i.name, i.qty, i.price].join(':')).join(',');
    payments.push({ pay_date: date, amount, note, src_row: r, src_key: keyOf(['P', date, amount, sig].join('|')), items });
  }
  return { payments, refunds, warn };
}
</script>

<script>
/* ---------- i18n ---------- */
const I18N = {
  ko: {
    title: '구매·수출·재고 관리', backup: '전체 백업', restore: '백업 복원', logout: '로그아웃',

    const d = ok(await sb.from(table).select(cols).order('id').range(from, from + 999));

    if (d.length < 1000) return out;

}

/* ---------- selectable tables: click / drag / select-all ---------- */
function bindSelect(table, key, onChange) {
  let drag = null;
  const rows = () => [...table.querySelectorAll('tbody tr[data-id]')];
  const setRow = (tr, on) => { const id = +tr.dataset.id; on ? sel[key].add(id) : sel[key].delete(id); tr.classList.toggle('sel', on); tr.querySelector('input').checked = on; };
  const paint = to => { const rs = rows(), a = Math.min(drag.from, to), b = Math.max(drag.from, to); rs.forEach((tr, k) => setRow(tr, k >= a && k <= b ? drag.on : drag.before[k])); onChange(); };
  table.onpointerdown = e => {
    if (e.button !== 0) return;
    const tr = e.target.closest('tbody tr[data-id]'); if (!tr) return;
    const rs = rows();
    drag = { from: rs.indexOf(tr), on: !sel[key].has(+tr.dataset.id), before: rs.map(r => sel[key].has(+r.dataset.id)) };
    paint(drag.from);
  };
  table.onpointerover = e => { if (!drag) return; const tr = e.target.closest('tbody tr[data-id]'); if (tr) paint(rows().indexOf(tr)); };
  addEventListener('pointerup', () => drag = null);
  table.onclick = e => {
    if (e.target.matches('tbody input[type=checkbox]') && e.detail) e.preventDefault();
    if (e.target.matches('thead input[type=checkbox]')) { rows().forEach(tr => setRow(tr, e.target.checked)); onChange(); }
  };
}

    const its = itemsByPay.get(p.id) || [];
    if ((f.q || f.cats.size) && !its.some(i => itemMatch(i, f))) return false;
    if (f.ps === 'ret') return !!p.returned_on;
    if (f.ps === 'none') return !its.length;
    if (f.ps === 'stock') return !p.returned_on && its.some(i => !i.exported_on);
    if (f.ps === 'done') return !p.returned_on && its.length && its.every(i => i.exported_on);

      skipP: parsed.payments.filter(p => pk.has(p.src_key)).length, skipR: parsed.refunds.filter(r => rk.has(r.src_key)).length };
    renderPreview();

    return its.length ? its.map(i => ({ ...b, [t.name]: i.name, [t.qty]: i.qty, [t.price]: i.price, [t.weightCol]: i.weight, [t.status]: t.st[status(i)], [t.exportDate]: i.exported_on || '' })) : [b]; });
  const refs = F.map(r => ({ [t.txDate]: r.tx_date, [t.refAmt]: r.amount, [t.note]: r.note, [t.linkedPay]: r.payment_id ? payById.get(r.payment_id)?.pay_date : '', [t.returnDate]: r.return_date || '' }));
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(refs), t.shRef);

    open.clear(); sel.stock.clear(); sel.done.clear();
    await reload(); alert(t.restored);
  } catch (err) { alert(t.syncFail(err.message)); }
};

/* ---------- shell ---------- */
const RENDER = { pay: renderPay, stock: renderStock, done: renderDone, ref: renderRef };
function showTab(tab) {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  ['pay', 'stock', 'done', 'ref', 'input'].forEach(k => $('tab-' + k).hidden = k !== tab);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

function renderAll() {
  const t = T(), pend = F.filter(r => !r.payment_id).length;
  $('meta').textContent = t.meta(won(P.length), won(I.length));
  $('cntStock').textContent = won(I.filter(i => status(i) === 'stock').length);
  $('cntDone').textContent = won(I.filter(i => status(i) === 'exported').length);
  $('cntRef').textContent = pend || '';
  $('cntRef').className = 'cnt' + (pend ? ' alert' : '');
  $('cntRef').hidden = !pend;
  $('refundBanner').hidden = !pend;
  $('refundBanner').innerHTML = `<span>${t.banner(pend)}</span><button class="btn sm" id="goRef">${t.goRef}</button>`;
  if (pend) $('goRef').onclick = () => showTab('ref');
  $('nameList').innerHTML = cats().filter(Boolean).map(c => `<option value="${esc(c)}">`).join('');
  renderPay(); renderStock(); renderDone(); renderRef(); renderPreview();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('buyexport.lang', l); } catch {}
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'ko';
  document.title = T().title;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = T()[e.dataset.i18n]);
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  $('mItems').querySelectorAll('tr').forEach(tr => { tr.querySelector('button').textContent = T().del; });
  if (!document.body.classList.contains('out')) renderAll();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  const { error } = await busy(() => sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value }));
  if (error) return $('loginErr').textContent = T().loginFail;
  $('password').value = '';
};
$('logout').onclick = () => sb.auth.signOut();

async function showSession(session) {
  document.body.classList.toggle('out', !session);
  if (!session) { P = []; I = []; F = []; return; }
  try { await busy(loadAll); } catch (err) { alert(T().loadFail(err.message)); }
  renderAll();
}

itemRow(); itemRow();
$('mDate').value = today();
setLang(lang);
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(() => showSession(session));
});
</script>
